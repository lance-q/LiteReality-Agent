[project]
name = "litereality-small-objects"
version = "0.1.0"
description = "RGB-D small-object reconstruction overlay for LiteReality-Agent and SAM3D"
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = { file = "LICENSE" }
dependencies = [
    "numpy",
    "opencv-python",
    "pillow",
    "trimesh>=4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/litereality_agent/small_object_pipeline"]

[dependency-groups]
dev = [
    "pytest>=8.4.0,<9",
    "ruff>=0.11.0",
]

[tool.uv]
required-version = ">=0.9.17"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
